<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixiv 画廊</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #ddd;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

            .tabs button {
                padding: 6px 12px;
                border-radius: 6px;
                border: 1px solid #444;
                background: #1e1e1e;
                color: #ccc;
                cursor: pointer;
                font-size: 12px;
            }

                .tabs button.on {
                    background: #3a6ea5;
                    border-color: #5a8ed5;
                    color: #fff;
                }

        .panel {
            display: none;
            padding: 8px 10px;
            border-bottom: 1px solid #2a2a2a;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

            .panel.on {
                display: flex;
            }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #ddd;
            cursor: pointer;
            font-size: 12px;
        }

            .btn:hover {
                border-color: #7af;
            }

        select, input[type="text"] {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #252525;
            color: #eee;
            font-size: 12px;
        }

        #pager {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid #2a2a2a;
        }

            #pager .info {
                font-size: 11px;
                color: #aaa;
                min-width: 90px;
                text-align: center;
            }

        #grid {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 5px;
            background: #0f0f0f;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-gap: 5px;
            grid-auto-rows: 1px;
            align-content: start;
        }

        .card {
            position: relative;
            grid-row-start: auto;
            display: block;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: #252525;
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

            .card:hover {
                border-color: #555;
                box-shadow: 0 0 10px rgba(0,0,0,0.35);
            }

            .card > img {
                display: block;
                width: 100%;
                height: auto;
                border-radius: 4px 4px 0 0;
                background: #111;
            }

            .card.sel {
                border-color: #6af;
                box-shadow: 0 0 14px rgba(102,170,255,0.35);
            }

            .card .t {
                max-width: 100%;
                padding: 4px 6px;
                font-size: 10px;
                background: rgba(0,0,0,0.65);
                color: #ccc;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                box-sizing: border-box;
                border-radius: 0 0 4px 4px;
            }

        #followPick, #searchPick {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            width: 100%;
        }

        .follow-user-card {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 8px;
            background: #1a1a1a;
            cursor: pointer;
            min-width: 0;
        }

            .follow-user-card.on {
                border-color: #6aa2ff;
                box-shadow: 0 0 0 1px #6aa2ff inset;
            }

        .follow-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }

        .follow-user-name {
            font-size: 12px;
            color: #ddd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .follow-user-id {
            font-size: 10px;
            color: #888;
        }

        .hint {
            font-size: 11px;
            color: #9aa;
        }

        #status {
            padding: 6px 10px;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="tabs" id="tabs">
            <button type="button" data-tab="rank" class="on">排行榜</button>
            <button type="button" data-tab="bm">我的收藏</button>
            <button type="button" data-tab="follow">我的关注</button>
            <button type="button" data-tab="search">用户搜索</button>
            <button type="button" data-tab="illust">作品搜索</button>
            <button type="button" data-tab="user">我的作品</button>
        </div>
        <label class="hint"><input type="checkbox" id="fltSensitive" checked /> 显示敏感内容</label>
        <label class="hint"><input type="checkbox" id="fltR18" checked /> 显示 R-18</label>
        <label class="hint"><input type="checkbox" id="fltR18G" checked /> 显示 R-18G</label>
    </header>
    <div class="panel on" id="p-rank">
        <select id="rankMode"><option value="day">日榜</option><option value="week">周榜</option><option value="month">月榜</option></select>
        <button class="btn" id="btnRank">加载</button>
    </div>
    <div class="panel" id="p-bm"><button class="btn" id="btnBm">加载收藏</button></div>
    <div class="panel" id="p-follow">
        <button class="btn" id="btnLoadFollow">刷新关注</button>
        <button class="btn" id="btnFollowIllust">查看其作品</button>
        <div id="followPick"></div>
    </div>
    <div class="panel" id="p-followbrowse">
        <button class="btn" id="btnBackFromFollowBrowse">返回关注列表</button>
        <span class="hint" id="followBrowseHint">用户作品</span>
    </div>
    <div class="panel" id="p-search">
        <input type="text" id="qUser" placeholder="输入用户ID或用户名" />
        <button class="btn" id="btnSearchUser">搜索用户</button>
        <button class="btn" id="btnSearchUserIllust">查看其作品</button>
        <span class="hint" id="searchUserHint">先搜索并选中一个用户</span>
        <div id="searchPick"></div>
    </div>
    <div class="panel" id="p-illust">
        <input type="text" id="qIllust" placeholder="输入关键词" style="width: 140px;" />

        <select id="illustSort">
            <option value="date_desc">最新发布</option>
            <option value="date_asc">最早发布</option>
            <option value="popular_desc">热门度排序</option>
        </select>
        <select id="illustBookmarks">
            <option value="">全部收藏</option>
            <option value="100users入り">100收藏+</option>
            <option value="250users入り">250收藏+</option>
            <option value="500users入り">500收藏+</option>
            <option value="1000users入り">1000收藏+</option>
            <option value="3000users入り">3000收藏+</option>
            <option value="5000users入り">5000收藏+</option>
            <option value="10000users入り">10000收藏+</option>
            <option value="20000users入り">20000收藏+</option>
            <option value="30000users入り">30000收藏+</option>
            <option value="50000users入り">50000收藏+</option>
        </select>
        <select id="illustRatio">
            <option value="">全部比例</option>
            <option value="0.5">横图 (宽图)</option>
            <option value="-0.5">竖图 (长图)</option>
            <option value="0">正方形图</option>
        </select>

        <button class="btn" id="btnSearchIllust">搜索作品</button>
    </div>
    <div class="panel" id="p-user">
        <span class="hint" id="userHint">当前账号：未登录</span>
        <button class="btn" id="btnUserIllust">加载我的作品</button>
    </div>
    <div class="panel" id="p-pages">
        <span class="hint" id="pagesHint">作品图片列表</span>
        <span class="hint" id="pagesAuthor">作者：-</span>
        <button class="btn" id="btnBackFromPages">返回列表</button>
    </div>
    <div id="pager"><button class="btn" id="btnPrevPage">上一页</button><div class="info" id="pageInfo">第 1 页</div><button class="btn" id="btnNextPage">下一页</button></div>
    <div id="grid"></div>
    <div id="status"></div>
    <script>
        (function () {
            var nodeId = (new URLSearchParams(location.search)).get("node_id") || "";
            var tab = "rank", PAGE_SIZE = 18, currentPage = 1, followPickUid = 0, followPickName = "", searchPickUid = 0, followIllustUser = 0, nextMaxBm = "";
            var myUid = 0;
            var browseSourceTab = "rank", browseSourcePage = 1, browseSourceStatus = "";
            var refreshToken = "", pixivCookie = "", pixivUserId = "";
            var selectedId = "";
            var selectedUrl = "";
            var currentAuthor = { id: 0, name: "", account: "" };

            function headers() { var h = { Accept: "application/json" }; if (refreshToken) h["X-Pixiv-Refresh-Token"] = refreshToken; if (pixivCookie) h["X-Pixiv-Cookie"] = pixivCookie; if (pixivUserId) h["X-Pixiv-User-Id"] = pixivUserId; return h; }
            function status(t) { document.getElementById("status").textContent = t || ""; }
            function setPageLabel() { document.getElementById("pageInfo").textContent = "第 " + currentPage + " 页"; }
            function relayoutCard(card) {
                var g = document.getElementById("grid");
                if (!g || !card) return;
                var img = card.querySelector("img");
                if (!img) return;
                var title = card.querySelector(".t");
                var cs = window.getComputedStyle(g);
                var rowGap = parseInt(cs.getPropertyValue("grid-row-gap") || cs.getPropertyValue("gap") || "0", 10) || 0;
                var rowHeight = parseInt(cs.getPropertyValue("grid-auto-rows") || "1", 10) || 1;
                var imgW = img.clientWidth || card.clientWidth || 0;
                var imgH = 0;
                if (imgW > 0 && img.naturalWidth > 0 && img.naturalHeight > 0) {
                    imgH = imgW * (img.naturalHeight / img.naturalWidth);
                } else {
                    imgH = img.clientHeight || 0;
                }
                var titleH = title ? title.getBoundingClientRect().height : 0;
                var totalH = Math.ceil(imgH + titleH + 4);
                if (totalH > 0) {
                    var spans = Math.ceil((totalH + rowGap) / (rowHeight + rowGap));
                    card.style.gridRowEnd = "span " + spans;
                }
            }
            var relayoutTimer = 0;
            function scheduleGridRelayout() {
                if (relayoutTimer) window.cancelAnimationFrame(relayoutTimer);
                relayoutTimer = window.requestAnimationFrame(function () {
                    relayoutTimer = 0;
                    var g = document.getElementById("grid");
                    if (!g) return;
                    Array.from(g.querySelectorAll(".card")).forEach(function (card) { relayoutCard(card); });
                });
            }
            function syncSelection() { window.parent.postMessage({ type: "fmiyd_pixiv_selection", node_id: nodeId, url: selectedUrl || "", urls: selectedUrl ? [selectedUrl] : [], nonce: String(Date.now()) }, "*"); }
            function clearSelection(push) {
                selectedId = "";
                selectedUrl = "";
                var g = document.getElementById("grid");
                if (g) { Array.from(g.querySelectorAll(".card.sel")).forEach(function (el) { el.classList.remove("sel"); }); }
                if (push !== false) syncSelection();
            }
            function clearGrid() { document.getElementById("grid").innerHTML = ""; }
            function clearUserPicks() { var a = document.getElementById("searchPick"); if (a) a.innerHTML = ""; }
            function proxy(u) { return u ? "/fmiyd/pixiv/proxy_image?url=" + encodeURIComponent(u) : ""; }
            function pickDisplayUrl(it) { var u = it.image_urls || {}; return u.large || u.medium || u.square_medium || ""; }
            function pickThumbUrl(it) { var u = it.image_urls || {}; return u.medium || u.large || u.square_medium || ""; }
            function setUserHint(uid, name) { document.getElementById("userHint").textContent = uid ? ("当前账号：" + uid + " " + (name || "")) : "当前账号：未登录"; }
            function renderPagesAuthor() {
                var a = document.getElementById("pagesAuthor");
                if (!a) return;
                if (!currentAuthor || !currentAuthor.id) {
                    a.textContent = "作者：-";
                    return;
                }
                a.textContent = "作者：" + (currentAuthor.name || "") + " (uid " + currentAuthor.id + ")";
            }
            function ratingQS() {
                var s = document.getElementById("fltSensitive");
                var r = document.getElementById("fltR18");
                var g = document.getElementById("fltR18G");
                return "&show_sensitive=" + (s && s.checked ? "1" : "0") + "&show_r18=" + (r && r.checked ? "1" : "0") + "&show_r18g=" + (g && g.checked ? "1" : "0");
            }

            function renderIllusts(list) {
                var g = document.getElementById("grid");
                g.innerHTML = "";
                clearSelection(true);
                (list || []).forEach(function (it) {
                    if (!it || !it.id) return;
                    var id = String(it.id);
                    var c = document.createElement("div");
                    c.className = "card";
                    var img = document.createElement("img");
                    img.loading = "lazy"; img.alt = ""; img.src = proxy(pickThumbUrl(it)) || "";
                    img.onload = function () { relayoutCard(c); };
                    img.onerror = function () { scheduleGridRelayout(); };
                    c.appendChild(img);
                    var t = document.createElement("div");
                    t.className = "t"; t.textContent = it.title || id;
                    c.appendChild(t);
                    c.onclick = function () { openIllustPages(it); };
                    g.appendChild(c);
                    relayoutCard(c);
                });
                scheduleGridRelayout();
            }

            function renderPageChoices(list) {
                var g = document.getElementById("grid");
                g.innerHTML = "";
                clearSelection(true);
                (list || []).forEach(function (it) {
                    if (!it) return;
                    var id = String(it.id || Math.random());
                    var c = document.createElement("div");
                    c.className = "card";
                    var img = document.createElement("img");
                    img.loading = "lazy"; img.alt = ""; img.src = proxy(pickThumbUrl(it)) || "";
                    img.onload = function () { relayoutCard(c); };
                    img.onerror = function () { scheduleGridRelayout(); };
                    c.appendChild(img);
                    var t = document.createElement("div");
                    t.className = "t"; t.textContent = it.title || id;
                    c.appendChild(t);
                    c.onclick = function () {
                        var u = ((it.meta_single_page || {}).original_image_url) || pickDisplayUrl(it);
                        if (!u) return;
                        Array.from(g.querySelectorAll(".card.sel")).forEach(function (el) { el.classList.remove("sel"); });
                        selectedId = id;
                        selectedUrl = u;
                        c.classList.add("sel");
                        syncSelection();
                        status("已选中该作品第 " + ((it.page_index || 0) + 1) + " 张图");
                    };
                    g.appendChild(c);
                    relayoutCard(c);
                });
                scheduleGridRelayout();
            }

            async function openIllustPages(it) {
                var iid = Number(it && it.illust_id || it && it.id || 0);
                if (!iid) { status("无效作品"); return; }
                browseSourceTab = tab;
                browseSourcePage = currentPage;
                browseSourceStatus = document.getElementById("status").textContent || "";
                var t = String(it && it.title || "");
                var d = await j("/fmiyd/pixiv/api/illust_pages?illust_id=" + encodeURIComponent(String(iid)) + "&title=" + encodeURIComponent(t));
                var pages = d.pages || [];
                currentAuthor = d.author || { id: 0, name: "", account: "" };
                tab = "pages";
                ["rank", "bm", "follow", "followbrowse", "search", "illust", "user", "pages"].forEach(function (k) { document.getElementById("p-" + k).classList.toggle("on", k === "pages"); });
                document.getElementById("pagesHint").textContent = "作品：" + (d.title || t || iid) + "（共 " + pages.length + " 张）";
                renderPagesAuthor();
                renderPageChoices(pages);
                setPageLabel();
                status("请选择该作品中的一张图片输出");
            }

            function backFromPages() {
                tab = browseSourceTab || "rank";
                ["rank", "bm", "follow", "followbrowse", "search", "illust", "user", "pages"].forEach(function (k) { document.getElementById("p-" + k).classList.toggle("on", k === tab); });
                currentPage = browseSourcePage || 1;
                setPageLabel();
                if (tab === "rank") loadRanking().catch(function (e) { status("排行榜失败: " + e.message); });
                else if (tab === "illust") loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); });
                else if (tab === "user") loadUser().catch(function (e) { status("我的作品失败: " + e.message); });
                else if (tab === "bm") loadBm(true).catch(function (e) { status("收藏失败: " + e.message); });
                else if (tab === "followbrowse") loadUserById(followIllustUser).catch(function (e) { status("用户作品失败: " + e.message); });
                else clearGrid();
                if (browseSourceStatus) status(browseSourceStatus);
            }

            function renderUserCards(rows, boxId, mode, append) {
                var box = document.getElementById(boxId);
                if (!box) return;
                if (!append) box.innerHTML = "";
                (rows || []).forEach(function (row) {
                    var u = (row && row.user) || row;
                    if (!u) return;
                    var uid = u.id != null ? u.id : u.userId;
                    uid = parseInt(String(uid || 0), 10) || 0;
                    if (!uid) return;
                    var card = document.createElement("div");
                    card.className = "follow-user-card";
                    var av = document.createElement("img");
                    av.className = "follow-user-avatar";
                    av.alt = "";
                    var avu = String(u.profile_image_url || u.profileImageUrl || "").trim();
                    if (avu) av.src = proxy(avu);
                    var wrap = document.createElement("div"); wrap.style.minWidth = "0";
                    var nm = document.createElement("div"); nm.className = "follow-user-name"; nm.textContent = u.name || u.userName || u.account || ("#" + uid);
                    var idiv = document.createElement("div"); idiv.className = "follow-user-id"; idiv.textContent = "uid " + uid;
                    wrap.appendChild(nm); wrap.appendChild(idiv);
                    card.appendChild(av); card.appendChild(wrap);
                    card.onclick = function () {
                        Array.from(box.querySelectorAll(".follow-user-card")).forEach(function (x) { x.classList.remove("on"); });
                        card.classList.add("on");
                        if (mode === "follow") {
                            followPickUid = uid;
                            followPickName = String(nm.textContent || "").trim();
                            status("已选关注用户 " + uid + " " + (nm.textContent || ""));
                        } else {
                            searchPickUid = uid;
                            document.getElementById("searchUserHint").textContent = "已选用户：" + uid + " " + (nm.textContent || "");
                            status("已选搜索用户 " + uid + " " + (nm.textContent || ""));
                        }
                    };
                    box.appendChild(card);
                });
            }

            async function j(url) { var r = await fetch(url, { headers: headers() }); var d = await r.json().catch(function () { return {}; }); if (!r.ok) throw new Error(d.error || String(r.status)); return d; }
            async function loadRanking() { var off = (currentPage - 1) * PAGE_SIZE; var mode = document.getElementById("rankMode").value; var d = await j("/fmiyd/pixiv/api/ranking?mode=" + encodeURIComponent(mode) + "&offset=" + off + ratingQS()); renderIllusts((d.illusts || []).slice(0, PAGE_SIZE)); status("排行榜 第 " + currentPage + " 页"); setPageLabel(); }

            function loadIllustDefaultBySort(sort) {
                var modeMap = { date_desc: "day", popular_desc: "week", date_asc: "month" };
                var mode = modeMap[String(sort || "date_desc")] || "day";
                var off = (currentPage - 1) * PAGE_SIZE;
                return j("/fmiyd/pixiv/api/ranking?mode=" + encodeURIComponent(mode) + "&offset=" + off + ratingQS()).then(function (d) {
                    renderIllusts((d.illusts || []).slice(0, PAGE_SIZE));
                    status("默认展示（" + mode + "）第 " + currentPage + " 页");
                    setPageLabel();
                });
            }

            // === 修改后的作品搜索函数 ===
            async function loadIllustSearch() {
                var w = document.getElementById("qIllust").value.trim();
                // 提取附加筛选参数
                var bm = document.getElementById("illustBookmarks").value;
                var sort = document.getElementById("illustSort").value;
                var ratio = document.getElementById("illustRatio").value;

                // 空关键词时：默认展示榜单；改动筛选后仍立即刷新结果。
                if (!w) {
                    if (!bm && !ratio) {
                        await loadIllustDefaultBySort(sort);
                        return;
                    }
                    // 仅筛选场景（无关键词）：以收藏门槛或通用词作为基准集，再叠加分类参数。
                    w = bm || "1girl";
                }

                // 收藏数筛选：直接拼接到搜索词（Pixiv最稳妥的过滤方式）
                var finalWord = bm ? (w + " " + bm) : w;

                var off = (currentPage - 1) * PAGE_SIZE;
                var url = "/fmiyd/pixiv/api/search_illust?word=" + encodeURIComponent(finalWord) + "&offset=" + off + ratingQS();
                url += "&sort=" + encodeURIComponent(sort);
                if (ratio) url += "&ratio=" + encodeURIComponent(ratio);

                var d = await j(url);
                if (d.error === "search_failed") { renderIllusts([]); status("未找到匹配作品：" + w); setPageLabel(); return; }
                renderIllusts((d.illusts || []).slice(0, PAGE_SIZE));
                status("作品搜索 第 " + currentPage + " 页");
                setPageLabel();
            }
            // =============================

            async function loadSearchUsers() { var w = document.getElementById("qUser").value.trim(); if (!w) { status("请输入用户ID或用户名"); return; } var off = (currentPage - 1) * PAGE_SIZE; var d = await j("/fmiyd/pixiv/api/search_user?word=" + encodeURIComponent(w) + "&offset=" + off); clearGrid(); var rows = d.users || d.user_previews || []; renderUserCards(rows, "searchPick", "search"); if (!rows.length) { document.getElementById("searchUserHint").textContent = "未找到用户"; } status("用户搜索 第 " + currentPage + " 页"); setPageLabel(); }
            async function resolveMyUid() {
                if (myUid > 0) return myUid;
                if (pixivUserId && /^\d+$/.test(String(pixivUserId))) { myUid = parseInt(String(pixivUserId), 10) || 0; if (myUid > 0) return myUid; }
                var d = await j("/fmiyd/pixiv/api/me");
                var u = (d && d.user) || {};
                var uid = parseInt(String(u.id || u.userId || 0), 10) || 0;
                if (uid > 0) { myUid = uid; setUserHint(uid, u.name || u.userName || ""); }
                return uid;
            }
            async function loadUserById(uid, opts) {
                opts = opts || {};
                uid = parseInt(String(uid || 0), 10) || 0;
                if (!uid) { status("无效用户"); return; }
                followIllustUser = uid;
                var off = (currentPage - 1) * PAGE_SIZE;
                var d = await j("/fmiyd/pixiv/api/user_illusts?user_id=" + uid + "&offset=" + off + ratingQS());
                renderIllusts((d.illusts || []).slice(0, PAGE_SIZE));
                status("用户 " + uid + " 第 " + currentPage + " 页");
                setPageLabel();
                if (opts.enterBrowse) {
                    tab = "followbrowse";
                    var lbl = String(opts.label || followPickName || "").trim() || ("#" + uid);
                    document.getElementById("followBrowseHint").textContent = "正在查看：" + lbl + "（uid " + uid + "）";
                    ["rank", "bm", "follow", "followbrowse", "search", "illust", "user", "pages"].forEach(function (k) { document.getElementById("p-" + k).classList.toggle("on", k === "followbrowse"); });
                }
            }
            async function loadUser() {
                var uid = await resolveMyUid();
                if (!uid) { status("未获取到当前账号 ID，请先同步账号并填写 user_id"); return; }
                var off = (currentPage - 1) * PAGE_SIZE;
                var d = await j("/fmiyd/pixiv/api/user_illusts?user_id=" + uid + "&offset=" + off + ratingQS());
                renderIllusts((d.illusts || []).slice(0, PAGE_SIZE));
                setUserHint(uid, "");
                status("我的作品 第 " + currentPage + " 页");
                setPageLabel();
            }
            async function loadBm(reset) { if (reset) nextMaxBm = ""; var url = "/fmiyd/pixiv/api/bookmarks?restrict=public" + ratingQS(); if (nextMaxBm) url += "&max_bookmark_id=" + encodeURIComponent(nextMaxBm); var d = await j(url); renderIllusts((d.illusts || []).slice(0, PAGE_SIZE)); nextMaxBm = d.next_max_bookmark_id ? String(d.next_max_bookmark_id) : ""; status("收藏 " + (nextMaxBm ? "可更多" : "")); setPageLabel(); }
            async function loadFollow(reset) { var box = document.getElementById("followPick"); var off = reset ? 0 : Number(box.dataset.off || 0); var d = await j("/fmiyd/pixiv/api/following?offset=" + off + "&restrict=public"); var rows = d.users || []; if (reset) { box.innerHTML = ""; box.dataset.off = "0"; followPickUid = 0; followPickName = ""; } renderUserCards(rows, "followPick", "follow", !reset); box.dataset.off = String(off + rows.length); status("关注列表已加载 " + (off + rows.length) + " 人"); }

            function switchTab(t) {
                tab = t;
                ["rank", "bm", "follow", "followbrowse", "search", "illust", "user", "pages"].forEach(function (k) { document.getElementById("p-" + k).classList.toggle("on", k === t); });
                currentPage = 1;
                clearGrid();
                clearSelection(true);
                if (t !== "search") clearUserPicks();
                setPageLabel();
                if (t === "follow") loadFollow(true).catch(function (e) { status("关注列表失败: " + e.message); });
            }

            document.getElementById("tabs").onclick = function (e) { var b = e.target.closest("button[data-tab]"); if (!b) return; Array.from(document.querySelectorAll("#tabs button")).forEach(function (x) { x.classList.toggle("on", x === b); }); switchTab(b.dataset.tab); };
            document.getElementById("btnRank").onclick = function () { currentPage = 1; loadRanking().catch(function (e) { status("排行榜失败: " + e.message); }); };
            document.getElementById("btnSearchUser").onclick = function () { searchPickUid = 0; document.getElementById("searchUserHint").textContent = "先搜索并选中一个用户"; currentPage = 1; loadSearchUsers().catch(function (e) { status("用户搜索失败: " + e.message); }); };
            document.getElementById("btnSearchUserIllust").onclick = function () { if (!searchPickUid) { status("请先选中一个搜索结果用户"); return; } currentPage = 1; loadUserById(searchPickUid).catch(function (e) { status("用户作品失败: " + e.message); }); };
            document.getElementById("btnSearchIllust").onclick = function () { currentPage = 1; loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); }); };
            ["illustSort", "illustBookmarks", "illustRatio"].forEach(function (id) {
                var el = document.getElementById(id);
                if (!el) return;
                el.onchange = function () {
                    if (tab !== "illust") return;
                    currentPage = 1;
                    loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); });
                };
            });
            document.getElementById("btnUserIllust").onclick = function () { currentPage = 1; loadUser().catch(function (e) { status("我的作品失败: " + e.message); }); };
            document.getElementById("btnBm").onclick = function () { loadBm(true).catch(function (e) { status("收藏失败: " + e.message); }); };
            document.getElementById("btnLoadFollow").onclick = function () { loadFollow(true).catch(function (e) { status("关注列表失败: " + e.message); }); };
            document.getElementById("btnFollowIllust").onclick = function () { if (!followPickUid) { status("请先选关注用户"); return; } currentPage = 1; loadUserById(followPickUid, { enterBrowse: true, label: followPickName }).catch(function (e) { status("用户作品失败: " + e.message); }); };
            document.getElementById("btnBackFromFollowBrowse").onclick = function () {
                tab = "follow";
                ["rank", "bm", "follow", "followbrowse", "search", "illust", "user", "pages"].forEach(function (k) { document.getElementById("p-" + k).classList.toggle("on", k === "follow"); });
                clearGrid();
                clearSelection(true);
                status("已返回关注列表");
            };
            document.getElementById("btnBackFromPages").onclick = function () { backFromPages(); };
            ["fltSensitive", "fltR18", "fltR18G"].forEach(function (id) {
                var el = document.getElementById(id);
                if (!el) return;
                el.onchange = function () {
                    currentPage = 1;
                    if (tab === "rank") loadRanking().catch(function (e) { status("排行榜失败: " + e.message); });
                    else if (tab === "illust") loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); });
                    else if (tab === "user") loadUser().catch(function (e) { status("我的作品失败: " + e.message); });
                    else if (tab === "followbrowse") loadUserById(followIllustUser).catch(function (e) { status("用户作品失败: " + e.message); });
                    else if (tab === "bm") loadBm(true).catch(function (e) { status("收藏失败: " + e.message); });
                };
            });
            document.getElementById("btnPrevPage").onclick = function () { if (tab === "pages") { status("当前是作品图片选择页，不使用翻页"); return; } if (currentPage <= 1) return; currentPage--; if (tab === "rank") loadRanking().catch(function (e) { status("排行榜失败: " + e.message); }); else if (tab === "search") loadSearchUsers().catch(function (e) { status("用户搜索失败: " + e.message); }); else if (tab === "illust") loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); }); else if (tab === "user") loadUser().catch(function (e) { status("我的作品失败: " + e.message); }); else if (tab === "followbrowse") loadUserById(followIllustUser).catch(function (e) { status("用户作品失败: " + e.message); }); setPageLabel(); };
            document.getElementById("btnNextPage").onclick = function () { if (tab === "pages") { status("当前是作品图片选择页，不使用翻页"); return; } currentPage++; if (tab === "rank") loadRanking().catch(function (e) { status("排行榜失败: " + e.message); }); else if (tab === "search") loadSearchUsers().catch(function (e) { status("用户搜索失败: " + e.message); }); else if (tab === "illust") loadIllustSearch().catch(function (e) { status("作品搜索失败: " + e.message); }); else if (tab === "user") loadUser().catch(function (e) { status("我的作品失败: " + e.message); }); else if (tab === "followbrowse") loadUserById(followIllustUser).catch(function (e) { status("用户作品失败: " + e.message); }); setPageLabel(); };
            window.addEventListener("resize", function () { scheduleGridRelayout(); });
            window.addEventListener("message", function (ev) { var d = ev.data; if (!d || d.type !== "fmiyd_pixiv_creds") return; refreshToken = String(d.refresh_token || "").trim(); pixivCookie = String(d.cookie || "").trim(); pixivUserId = String(d.user_id || "").trim(); if (!(refreshToken || pixivCookie)) { status("未配置登录凭据"); return; } status("正在验证登录..."); j("/fmiyd/pixiv/api/me").then(function (me) { var u = (me && me.user) || {}; var uid = String(u.id || u.userId || "").trim(); if (uid) { myUid = parseInt(uid, 10) || 0; setUserHint(myUid, u.name || u.userName || ""); status("已登录：uid " + uid); } else { status("已同步账号，但未解析到用户信息"); } }).catch(function (e) { status("登录校验失败: " + e.message); }); currentPage = 1; loadRanking().catch(function (e) { status("排行榜失败: " + e.message); }); });
            status("等待父页同步 Pixiv 账号…");
        })();
    </script>
</body>
</html>
